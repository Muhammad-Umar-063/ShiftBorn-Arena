name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiftborn-arena-app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: shiftborn-arena-app/.nvmrc
          cache: pnpm
          cache-dependency-path: shiftborn-arena-app/pnpm-lock.yaml
      - name: Install frozen dependencies and Chromium
        run: pnpm run setup
      - name: Test
        run: pnpm test
